name: framework acceptance

# LangGraph and CrewAI drive warren-server over its control-plane MCP endpoint, on the
# scripted in-memory runtime. This repo's uv.lock is standalone (CrewAI pins
# pydantic<2.13 and an mcp version warren-server doesn't allow), and warren-server
# itself isn't a published artifact (tests.control_plane_server is test-only code) --
# so warren is checked out as a sibling directory and the server runs from its own
# workspace venv, in its own process; this repo only shares HTTP with it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: warren-examples

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scottcowan/warren
          path: warren

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install warren-server (workspace venv)
        working-directory: warren
        run: uv sync --package warren-server --extra dev

      # CrewAI's MCP client needs 3.12+ (see pyproject.toml).
      - name: Install this repo's own venv
        working-directory: warren-examples
        run: uv sync --locked --python 3.12

      - name: Run acceptance tests
        working-directory: warren-examples
        env:
          WARREN_REPO_ROOT: ${{ github.workspace }}/warren
        run: timeout 600 uv run --locked --python 3.12 pytest -v -m frameworks
